name: Package Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore tests
        run: dotnet restore backend/Aegis.Agent.Tests/Aegis.Agent.Tests.csproj

      - name: Test
        run: dotnet test backend/Aegis.Agent.Tests/Aegis.Agent.Tests.csproj -c Release --no-restore

      - name: Publish Windows x64
        run: >
          dotnet publish backend/Aegis.Agent/Aegis.Agent.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o dist/AEGIS

      - name: Package service scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./dist/AEGIS/scripts | Out-Null
          Copy-Item ./scripts/install-service.ps1 ./dist/AEGIS/scripts/install-service.ps1
          Copy-Item ./scripts/uninstall-service.ps1 ./dist/AEGIS/scripts/uninstall-service.ps1
          Copy-Item ./install-service.bat ./dist/AEGIS/install-service.bat
          Copy-Item ./uninstall-service.bat ./dist/AEGIS/uninstall-service.bat

      - name: Smoke packaged executable
        shell: pwsh
        run: ./scripts/smoke-agent.ps1 -Executable ./dist/AEGIS/Aegis.Agent.exe

      - name: Windows Service smoke
        shell: pwsh
        run: ./scripts/smoke-service.ps1 -Executable ./dist/AEGIS/Aegis.Agent.exe

      - name: Upload AEGIS bundle
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS-windows-x64
          path: dist/AEGIS
