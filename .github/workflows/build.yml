name: Build Windows Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/Aegis.Agent/Aegis.Agent.csproj

      - name: Build
        run: dotnet build backend/Aegis.Agent/Aegis.Agent.csproj -c Release --no-restore
