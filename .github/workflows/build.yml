name: Build Windows Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check frontend syntax
        shell: bash
        run: |
          node --check app.js
          node --check aether.js

      - name: Check frontend structure
        run: node scripts/check-frontend.mjs

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "./scripts/smoke-agent.ps1",
            "./scripts/install-service.ps1",
            "./scripts/uninstall-service.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file: $($_.Message)" }
              throw "PowerShell syntax validation failed: $file"
            }
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/Aegis.Agent.Tests/Aegis.Agent.Tests.csproj

      - name: Build
        run: dotnet build backend/Aegis.Agent/Aegis.Agent.csproj -c Release --no-restore

      - name: Test
        run: dotnet test backend/Aegis.Agent.Tests/Aegis.Agent.Tests.csproj -c Release --no-restore

      - name: Runtime smoke test
        shell: pwsh
        run: ./scripts/smoke-agent.ps1

      - name: Publish verification bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >
          dotnet publish backend/Aegis.Agent/Aegis.Agent.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o dist/AEGIS

      - name: Smoke published executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./scripts/smoke-agent.ps1 -Executable ./dist/AEGIS/Aegis.Agent.exe
