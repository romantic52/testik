name: Build Windows Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check frontend syntax
        shell: bash
        run: |
          node --check app.js
          node --check aether.js

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/Aegis.Agent.Tests/Aegis.Agent.Tests.csproj

      - name: Build
        run: dotnet build backend/Aegis.Agent/Aegis.Agent.csproj -c Release --no-restore

      - name: Test
        run: dotnet test backend/Aegis.Agent.Tests/Aegis.Agent.Tests.csproj -c Release --no-restore

      - name: Runtime smoke test
        shell: pwsh
        run: ./scripts/smoke-agent.ps1
